<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Drag And Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <button class="right addTask">Add new Task</button>

        </nav>
        <section class="board">
            <div class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>

                    <div class="right">Count</div>
                </div>
            </div>


            <div class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>
                </div>
            </div>

             <div class="task-column">
                <div class="heading">
                <div class="left">Done</div>
                <div class="right">Count</div>
                 </div>
            </div>


           
        </section>
    </main>

    <Script src="script.js"></Script>
</body>
</html>
