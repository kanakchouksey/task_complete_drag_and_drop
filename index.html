<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Drag And Drop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <button class="right addTask" id="toggle_modal">Add new Task</button>

        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>

                    <div class="right">Count</div>
                </div>

                <div draggable="true" class="task">
                    <h2>Task1</h2>
                    <p>Description of task</p>
                    <button class="delete">Delete</button>
                </div>
            </div>


            <div id="progress" class="task-column ">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>

                </div>


            </div>

            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>

                </div>
            </div>



        </section>
    </main>

    <div class="modal addNewTask">
        <div class="bg"></div>
        <div class="center">
            <input type="text" placeholder="task title">
            <textarea placeholder="task description" id="task-title-input"></textarea>
            <button id="add-new-task" class="addtask_btn" id="task-desc-input">Add Task</button>
        </div>

    </div>


    <Script src="script.js"></Script>
</body>

</html>
